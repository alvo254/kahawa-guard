# Serves the built app and proxies /api to the gateway inside the cluster, so
# the browser only ever talks to one address. Runs as an unprivileged user on
# an unprivileged port in both profiles.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway.gateway.svc.cluster.local:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;              # needed for the /api/events SSE stream
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
