apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: false
  rules:
    - name: require-pinned-tag
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["kahawa-ui", "gateway", "tools", "n8n", "data"]
      validate:
        failureAction: Enforce   # older Kyverno releases set validationFailureAction at spec level
        message: "Images must be pinned; the latest tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
