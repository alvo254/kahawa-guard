# One control plane, two workers. kind's default CNI and kube-proxy are both
# disabled so Cilium can take over the network entirely.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kahawa
networking:
  disableDefaultCNI: true
  kubeProxyMode: none
nodes:
  - role: control-plane
  - role: worker
  - role: worker
