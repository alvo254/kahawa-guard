{{/*
NAKED: a plain Secret rendered from values, consumed as environment variables.
HARDENED: no Secret here at all — an ExternalSecret pulls from Vault and the
gateway reads the values as mounted files.
*/}}
{{- if not .Values.security.secretsFromVault }}
apiVersion: v1
kind: Secret
metadata:
  name: kahawa-secrets
  namespace: gateway
  labels:
    {{- include "kahawa.labels" . | nindent 4 }}
type: Opaque
stringData:
  MISTRAL_API_KEY: {{ .Values.llm.mistral.apiKey | default "" | quote }}
  SHIELDSTRAL_API_KEY: {{ .Values.shieldstral.apiKey | default "" | quote }}
  N8N_MCP_TOKEN: {{ .Values.n8n.mcpToken | default "" | quote }}
  ADMIN_TOKEN: {{ .Values.adminToken | default "" | quote }}
{{- else }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-dev
  namespace: gateway
  labels:
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kahawa-secrets
  namespace: gateway
  labels:
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-dev
    kind: SecretStore
  target:
    name: kahawa-secrets
    creationPolicy: Owner
  data:
    - secretKey: MISTRAL_API_KEY
      remoteRef: { key: kahawa, property: mistral_api_key }
    - secretKey: SHIELDSTRAL_API_KEY
      remoteRef: { key: kahawa, property: shieldstral_api_key }
    - secretKey: N8N_MCP_TOKEN
      remoteRef: { key: kahawa, property: n8n_mcp_token }
    - secretKey: ADMIN_TOKEN
      remoteRef: { key: kahawa, property: admin_token }
{{- end }}
