{{/*
NAKED: no ServiceAccount of its own, so the pod uses `default` with its token
mounted, plus a Role that can read secrets — exactly the over-permission the
demo goes on to punish.
HARDENED: one ServiceAccount per workload, no token, no extra RBAC.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: gateway
  labels:
    {{- include "kahawa.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.security.automountServiceAccountToken }}
{{- if not .Values.security.restricted }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-too-much
  namespace: gateway
  labels:
    {{- include "kahawa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-too-much
  namespace: gateway
  labels:
    {{- include "kahawa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-too-much
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: gateway
{{- end }}
