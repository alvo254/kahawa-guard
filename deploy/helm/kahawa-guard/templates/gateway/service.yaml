apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: gateway
  labels:
    app: gateway
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.expose.type }}
  selector: { app: gateway }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      {{- if eq .Values.expose.type "NodePort" }}
      nodePort: 30800
      {{- end }}
