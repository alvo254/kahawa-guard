apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: data
  labels:
    app: redis
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels:
        app: redis
        {{- include "kahawa.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.security.automountServiceAccountToken }}
      {{- include "kahawa.podSecurityContext" . | nindent 6 }}
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          {{- include "kahawa.containerSecurityContext" . | nindent 10 }}
          {{- include "kahawa.resources" (dict "root" . "component" "redis") | nindent 10 }}
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels:
    app: redis
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
