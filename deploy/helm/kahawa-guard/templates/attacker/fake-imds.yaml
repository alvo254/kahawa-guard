{{- if .Values.attacker.enabled }}
{{/*
Stands in for a cloud metadata service and serves dummy credentials. Scene 3b
walks fetch_url into it. Nothing here is a real credential.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-imds
  namespace: attacker
  labels:
    app: fake-imds
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: fake-imds }
  template:
    metadata:
      labels:
        app: fake-imds
        {{- include "kahawa.labels" . | nindent 8 }}
    spec:
      containers:
        - name: imds
          image: {{ include "kahawa.image" (dict "root" . "name" "fake-imds") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fake-imds
  namespace: attacker
  labels:
    app: fake-imds
    {{- include "kahawa.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app: fake-imds }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
