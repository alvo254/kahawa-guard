# Shared defaults. The profile files on top of this are what actually differ:
#   -f values.yaml -f values-naked.yaml      (or values-hardened.yaml)
pack: coffee
profile: naked

image:
  registry: kahawa
  tag: dev
  pullPolicy: IfNotPresent

llm:
  provider: mistral                 # mistral | ollama
  mistral:
    chatModel: ministral-8b-2512       # free tier: 625k TPM / 3.13 RPS (mistral-small: 20k TPM / 1 RPS -> 429s)
    embedModel: mistral-embed
    guardrailModel: moderation_llm_v2          # inline guardrails key on /v1/chat/completions
    moderationModel: mistral-moderation-latest # model for the standalone /v1/moderations call
  ollama:
    # The kind Docker network gateway, i.e. the host. Confirm with:
    #   docker network inspect kind
    baseUrl: http://172.18.0.1:11434/v1
    chatModel: mistral-small3.2
    embedModel: nomic-embed-text
  # MUST match the vector(n) column in data/schema.sql.
  # 1024 for mistral-embed, 768 for nomic-embed-text.
  embedDim: 1024

shieldstral:
  url: ""
  mode: cached                      # live | cached
  apiKey: ""

# Guard pipeline switches. The admin panel flips these at runtime; these are the
# values the gateway starts with.
guards:
  inputGuard: false
  expertGuard: false
  provenance: false
  registry: false
  toolGate: false
  budgets: false

data:
  postgres:
    user: kahawa
    password: kahawa
    database: kahawa
  redis: {}

mcp:
  # name, in-cluster url, and the pinned sha256 of the sorted tools/list result.
  # Fill pins from `make mcp-pin`; an empty pin means "do not verify" and is only
  # acceptable in the naked profile.
  servers:
    - name: kahawa-tools
      url: http://kahawa-tools.tools.svc.cluster.local:8000/mcp
      pin: ""
    - name: n8n
      # One MCP Server Trigger workflow (n8n/workflows/kahawa_mcp.json) serves every n8n tool.
      url: http://n8n.n8n.svc.cluster.local:5678/mcp/kahawa
      pin: ""
    - name: farm-weather
      # The rogue server (attacker namespace). Scene 3 only: the coffee pack
      # allowlists it so the hidden instruction in get_forecast reaches the model.
      url: http://farm-weather.attacker.svc.cluster.local:8000/mcp
      pin: ""

attacker:
  enabled: true                     # fake-imds and the rogue farm-weather server
  farmWeather:
    rugPull: false                  # flip for the pinning moment in Scene 3

recordsFs:
  enabled: true                     # Scene 3c, stdio server

# Overridden wholesale by the profile files.
security:
  restricted: false
  automountServiceAccountToken: true
  readOnlyRootFilesystem: false
  runAsNonRoot: false
  adminTokenRequired: false
  secretsFromVault: false

expose:
  type: NodePort

resources:
  enabled: false
  quotas: false
  default:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  gateway:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

n8n:
  # Naked leaves the Code and Execute Command nodes enabled; hardened blocks them.
  nodesExclude: ""
  requireMcpToken: false
  atApiKey: ""                      # Africa's Talking sandbox key; set from .env by make deploy
